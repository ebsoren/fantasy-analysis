<title>Draft Board</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #181b23;
  --border: #2a2d38;
  --text: #e2e4ea;
  --text-dim: #8b8fa3;
  --text-muted: #555869;
  --accent: #5b8af5;
  --qb: #e06c8e;
  --rb: #58b896;
  --wr: #6fa8dc;
  --te: #d4a95a;
  --k: #a78bda;
  --def: #8bc9da;
  --drafted-bg: #13151a;
  --drafted-text: #3a3d4a;
  --btn-bg: #232631;
  --btn-hover: #2d3140;
  --round-bg: #1e2029;
  --round-border: #3a3d52;
  --kept-bg: #1a1520;
  --kept-border: #3a2d52;
  --kept-text: #9a8abf;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.4;
  padding: 20px;
}

.header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
.header .stats { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 8px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Controls ── */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}

.chip:hover { border-color: var(--text-dim); color: var(--text); }
.chip.active { border-color: var(--accent); color: var(--accent); background: rgba(91,138,245,0.08); }
.chip.pos-qb.active { border-color: var(--qb); color: var(--qb); background: rgba(224,108,142,0.08); }
.chip.pos-rb.active { border-color: var(--rb); color: var(--rb); background: rgba(88,184,150,0.08); }
.chip.pos-wr.active { border-color: var(--wr); color: var(--wr); background: rgba(111,168,220,0.08); }
.chip.pos-te.active { border-color: var(--te); color: var(--te); background: rgba(212,169,90,0.08); }
.chip.pos-k.active { border-color: var(--k); color: var(--k); background: rgba(167,139,218,0.08); }
.chip.pos-def.active { border-color: var(--def); color: var(--def); background: rgba(139,201,218,0.08); }

.toggle-btn {
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.toggle-btn:hover { border-color: var(--text-dim); }
.toggle-btn.on { border-color: var(--accent); color: var(--accent); }

.reset-btn {
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid #6b2020;
  background: rgba(107,32,32,0.2);
  color: #d45555;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.reset-btn:hover { background: rgba(107,32,32,0.4); }

.search-box {
  padding: 5px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  width: 180px;
}
.search-box::placeholder { color: var(--text-muted); }
.search-box:focus { outline: none; border-color: var(--accent); }

.spacer { flex: 1; }

/* ── Table ── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--surface);
  padding: 8px 10px;
  text-align: left;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: default;
  user-select: none;
}

thead th.r { text-align: right; }

.round-row td {
  background: var(--round-bg);
  padding: 6px 10px;
  font-weight: 600;
  font-size: 12px;
  color: var(--accent);
  border-top: 1px solid var(--round-border);
  border-bottom: 1px solid var(--round-border);
  letter-spacing: 0.3px;
}

tbody tr { transition: background 0.1s; }
tbody tr:not(.round-row):hover { background: rgba(91,138,245,0.04); }
tbody td {
  padding: 5px 10px;
  border-bottom: 1px solid rgba(42,45,56,0.5);
  white-space: nowrap;
}
tbody td.r { text-align: right; }

.pos-badge {
  display: inline-block;
  width: 28px;
  text-align: center;
  font-weight: 600;
  font-size: 11px;
  padding: 1px 0;
  border-radius: 3px;
}

.pos-QB { color: var(--qb); background: rgba(224,108,142,0.12); }
.pos-RB { color: var(--rb); background: rgba(88,184,150,0.12); }
.pos-WR { color: var(--wr); background: rgba(111,168,220,0.12); }
.pos-TE { color: var(--te); background: rgba(212,169,90,0.12); }
.pos-K { color: var(--k); background: rgba(167,139,218,0.12); }
.pos-DEF { color: var(--def); background: rgba(139,201,218,0.12); }

.draft-btn {
  padding: 2px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--btn-bg);
  color: var(--text-dim);
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.1s;
  min-width: 76px;
}
.draft-btn:hover { border-color: var(--accent); color: var(--accent); }

tr.drafted td { background: var(--drafted-bg); color: var(--drafted-text); }
tr.drafted .name-cell { text-decoration: line-through; }
tr.drafted .pos-badge { opacity: 0.3; }
tr.drafted .draft-btn { border-color: #3a5a3a; color: #5a9a5a; background: rgba(58,90,58,0.15); }

tr.keeper td { background: var(--kept-bg); color: var(--kept-text); }
tr.keeper .pos-badge { opacity: 0.5; }
tr.keeper .name-cell { font-style: italic; }

.kept-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  border: 1px solid var(--kept-border);
  background: rgba(58,45,82,0.25);
  color: var(--kept-text);
  font-size: 11px;
  font-family: inherit;
  min-width: 76px;
  text-align: center;
  cursor: default;
}

.adj-cell {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.injury-high { color: #d45555; }
.injury-med { color: #d4a95a; }
.injury-low { color: var(--rb); }
.td-value { font-weight: 600; }

/* ── Analytics ── */
.panel { display: none; }
.panel.active { display: block; }

.chart-header { margin-bottom: 16px; }
.chart-header h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.chart-header p { font-size: 12px; color: var(--text-dim); }

.chart-wrap {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  padding: 16px;
  overflow: hidden;
}

.chart-wrap canvas {
  display: block;
  max-width: 100%;
}

.chart-tooltip {
  position: fixed;
  display: none;
  padding: 8px 12px;
  background: #232631;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  color: var(--text);
  pointer-events: none;
  z-index: 100;
  line-height: 1.5;
  white-space: nowrap;
}

.chart-legend {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  justify-content: center;
}
.chart-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-dim);
}
.chart-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
</style>

const TEAMS = 12;
const ROUNDS = 18;
const LS_KEY = 'draftBoard_drafted_v3';
const POS_COLORS = { QB: '#e06c8e', RB: '#58b896', WR: '#6fa8dc', TE: '#d4a95a', K: '#a78bda', DEF: '#8bc9da' };

/* ── Keeper computation ── */
const keeperMap = new Map();
KEEPERS.forEach(k => {
  k.overallPick = (k.round - 1) * TEAMS + k.pick;
  keeperMap.set(k.name, k);
});

function buildKeeperRankInfo(data) {
  const info = [];
  for (const r of data) {
    const ki = keeperMap.get(r[1]);
    if (ki) info.push({ origRank: r[0], overallPick: ki.overallPick });
  }
  return info;
}

let currentKeeperInfo = buildKeeperRankInfo(DATA);

function rebuildKeeperInfo() {
  currentKeeperInfo = buildKeeperRankInfo(activeData());
}

function getAdjRank(origRank) {
  let delta = 0;
  for (const k of currentKeeperInfo) {
    if (k.origRank < origRank && k.overallPick > origRank) delta++;
  }
  return origRank - delta;
}

/* ── State ── */
let drafted = new Set();
try { drafted = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch(e) {}
let posFilter = 'ALL';
let hideDrafted = false;
let hideKeepers = false;
let searchTerm = '';

function saveDrafted() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...drafted])); } catch(e) {}
}

function injClass(s) {
  const n = parseFloat(s);
  if (n >= 60) return 'injury-high';
  if (n >= 40) return 'injury-med';
  return 'injury-low';
}

/* ── Board rendering ── */
function renderBoard() {
  const data = activeData();
  const isFull = compBase === 'ds';
  const colSpan = isFull ? 13 : 5;

  const thead = document.getElementById('board-thead');
  if (isFull) {
    thead.innerHTML = `<tr>
      <th style="width:36px">#</th><th style="width:40px">Adj</th><th style="width:84px"></th>
      <th>Player</th><th>Pos</th><th>Team</th><th>Bye</th><th>Age</th>
      <th>Inj</th><th class="r">Floor</th><th class="r">Proj</th><th class="r">Ceil</th><th class="r">3D</th>
    </tr>`;
  } else {
    thead.innerHTML = `<tr>
      <th style="width:36px">#</th><th style="width:40px">Adj</th><th style="width:84px"></th>
      <th>Player</th><th>Pos</th>
    </tr>`;
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let availCount = 0, draftedCount = 0, keptCount = 0;
  let lastRound = 0;

  const visible = data.filter(r => {
    const isKeeper = keeperMap.has(r[1]);
    if (posFilter !== 'ALL' && r[2] !== posFilter) return false;
    if (hideKeepers && isKeeper) return false;
    if (hideDrafted && !isKeeper && drafted.has(r[1])) return false;
    if (searchTerm && !r[1].toLowerCase().includes(searchTerm)) return false;
    return true;
  });

  for (const r of visible) {
    const rank = r[0];
    const name = r[1];
    const isKeeper = keeperMap.has(name);
    const isDrafted = !isKeeper && drafted.has(name);
    const adj = isKeeper ? null : getAdjRank(rank);
    const rd = Math.min(ROUNDS, Math.max(1, Math.ceil(rank / TEAMS)));

    if (isKeeper) keptCount++;
    else if (isDrafted) draftedCount++;
    else availCount++;

    if (rd !== lastRound) {
      lastRound = rd;
      const keepersInRound = KEEPERS.filter(k => k.round === rd).length;
      const label = keepersInRound
        ? `Round ${rd} — ${keepersInRound} keeper${keepersInRound > 1 ? 's' : ''}`
        : `Round ${rd}`;
      const rr = document.createElement('tr');
      rr.className = 'round-row';
      rr.innerHTML = `<td colspan="${colSpan}">${label}</td>`;
      tbody.appendChild(rr);
    }

    const tr = document.createElement('tr');
    if (isKeeper) tr.className = 'keeper';
    else if (isDrafted) tr.className = 'drafted';

    const ki = keeperMap.get(name);
    let btnCell;
    if (isKeeper) {
      btnCell = `<td><span class="kept-badge">KEPT ${ki.round}.${String(ki.pick).padStart(2,'0')}</span></td>`;
    } else {
      btnCell = `<td><button class="draft-btn" data-name="${name}">${isDrafted ? 'Drafted' : 'Set Drafted'}</button></td>`;
    }

    let adjCell;
    if (isKeeper) {
      adjCell = `<td class="adj-cell" style="color:var(--kept-text)">—</td>`;
    } else {
      adjCell = `<td class="adj-cell">${adj}</td>`;
    }

    if (isFull) {
      tr.innerHTML = `
        <td>${rank}</td>${adjCell}${btnCell}
        <td class="name-cell">${name}</td>
        <td><span class="pos-badge pos-${r[2]}">${r[2]}</span></td>
        <td>${r[3]}</td><td>${r[4]}</td><td>${r[10] || '—'}</td>
        <td class="${injClass(r[5])}">${r[5]}</td>
        <td class="r">${r[6]}</td><td class="r">${r[7]}</td>

      tr.innerHTML = `
        <td>${rank}</td>${adjCell}${btnCell}
        <td class="name-cell">${name}</td>
        <td><span class="pos-badge pos-${r[2]}">${r[2]}</span></td>`;
    }
    tbody.appendChild(tr);
  }

    `${availCount} available · ${draftedCount} drafted · ${keptCount} kept`;

/* ── Chart ── */
let chartPoints = [];

function drawChart() {
  const canvas = document.getElementById('chart');
  const container = canvas.parentElement;
  const W = Math.min(900, container.clientWidth - 32);
  const H = Math.round(W * 0.62);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { l: 48, r: 20, t: 20, b: 40 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;

  const data = activeData();
  if (currentKeeperInfo.length === 0) {
    ctx.fillStyle = '#181b23'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#8b8fa3'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
    ctx.fillText('No keeper data for ' + SRC_LABELS[compBase], W/2, H/2);
    chartPoints = []; return;
  }
  let lastAffected = 0;
  for (const r of data) {
    if (!keeperMap.has(r[1]) && getAdjRank(r[0]) !== r[0]) lastAffected = r[0];
  }
  const maxR = Math.ceil(lastAffected / TEAMS) * TEAMS || TEAMS;
  const nonKeepers = data.filter(r => !keeperMap.has(r[1]) && r[0] <= maxR);
  const keptMax = Math.max(...currentKeeperInfo.map(k => k.overallPick));
  const sx = v => pad.l + ((v - 1) / (maxR - 1)) * pw;
  const sy = v => pad.t + ((v - 1) / (maxR - 1)) * ph;

  ctx.fillStyle = '#181b23';
  ctx.fillRect(0, 0, W, H);

  // Axis labels
  ctx.fillStyle = '#8b8fa3';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Adjusted Rank', pad.l + pw / 2, H - 4);
  ctx.save();
  ctx.translate(12, pad.t + ph / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Original Rank', 0, 0);
  ctx.restore();

  // Round boundary grid
  ctx.fillStyle = '#555869';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  for (let i = 12; i <= maxR; i += 12) {
    const x = sx(i);
    ctx.strokeStyle = '#3a3d52';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillText(i, x, H - pad.b + 13);
    ctx.font = '9px monospace';
    ctx.fillText('R' + (i / 12 + 1), x, pad.t - 4);
    ctx.font = '10px monospace';
  }
  // R1 label
  ctx.font = '9px monospace';
  ctx.fillText('R1', pad.l + 12, pad.t - 4);
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  for (let i = 12; i <= maxR; i += 12) {
    const y = sy(i);
    ctx.strokeStyle = '#3a3d52';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillText(i, pad.l - 6, y + 4);
  }

  // Diagonal y = x
  ctx.strokeStyle = '#3a3d52';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.moveTo(sx(1), sy(1));
  ctx.lineTo(sx(maxR), sy(maxR));
  ctx.stroke();

  // Max displacement line
  const nKeepers = currentKeeperInfo.length;
  ctx.strokeStyle = '#3a3d52';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(sx(1), sy(1 + nKeepers));
  ctx.lineTo(sx(maxR - nKeepers), sy(maxR));
  ctx.stroke();
  ctx.setLineDash([]);

  // Keeper/gap dots on diagonal
  chartPoints = [];
  const keptInRange = data.filter(r => keeperMap.has(r[1]) && r[0] <= maxR);
  for (const r of keptInRange) {
    const v = r[0];
    const x = sx(v);
    const y = sy(v);
    ctx.fillStyle = '#9a8abf';
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    chartPoints.push({ x, y, r, adj: v, delta: 0, isGap: true });
  }

  // Points
  for (const r of nonKeepers) {
    const origRank = r[0];
    const adj = getAdjRank(origRank);
    const x = sx(adj);
    const y = sy(origRank);
    const delta = origRank - adj;

    ctx.fillStyle = POS_COLORS[r[2]] || '#888';
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();

    chartPoints.push({ x, y, r, adj, delta });
  }
  ctx.globalAlpha = 1.0;
}

/* ── Chart tooltip ── */
function setupChartHover() {
  const canvas = document.getElementById('chart');
  const tooltip = document.getElementById('chart-tooltip');
  const dpr = window.devicePixelRatio || 1;

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / dpr) / rect.width;
    const my = (e.clientY - rect.top) * (canvas.height / dpr) / rect.height;

    let nearest = null;
    let minDist = 15;
    for (const p of chartPoints) {
      const d = Math.sqrt((mx - p.x) ** 2 + (my - p.y) ** 2);
      if (d < minDist) { minDist = d; nearest = p; }
    }

    if (nearest) {
      const r = nearest.r;
      if (nearest.isGap) {
        const ki = keeperMap.get(r[1]);
        tooltip.innerHTML = `<span style="color:#9a8abf"><strong>${r[1]}</strong></span><br>` +
          (ki ? `Kept ${ki.round}.${String(ki.pick).padStart(2,'0')} · Rank ${r[0]}` : `Rank ${r[0]}`);
      } else {
        tooltip.innerHTML =
          `<strong>${r[1]}</strong> · <span style="color:${POS_COLORS[r[2]]}">${r[2]}</span><br>` +
          `Pick ${nearest.adj} has true value of pick ${r[0]}`;
      }
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  });

  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

let compBase = 'ds';
let compA = 'ds';
let compB = 'espn';
const DATA_MAP = { ds: DATA, boone: DATA_BOONE, ciely: DATA_CIELY };
const SRC_LABELS = { ds: 'DraftSharks', boone: 'Boone', ciely: 'Ciely', espn: 'ESPN', fp: 'FantasyPros' };
const SRC_SHORT = { ds: 'DS', boone: 'Boone', ciely: 'Ciely', espn: 'ESPN', fp: 'FP' };
function activeData() { return DATA_MAP[compBase]; }

function buildComparison(srcA, srcB) {
  const ranksA = RANKS[srcA], ranksB = RANKS[srcB];
  if (!ranksA || !ranksB) return [];
  const mapA = new Map(ranksA.map(r => [r[0], r[2]]));
  const mapB = new Map(ranksB.map(r => [r[0], r[2]]));
  const posMap = new Map(ranksA.map(r => [r[0], r[1]]));
  ranksB.forEach(r => { if (!posMap.has(r[0])) posMap.set(r[0], r[1]); });
  const kiA = [], kiB = [];
  for (const [name, k] of keeperMap) {
    const rA = mapA.get(name), rB = mapB.get(name);
    if (rA != null) kiA.push({ origRank: rA, overallPick: k.overallPick });
    if (rB != null) kiB.push({ origRank: rB, overallPick: k.overallPick });
  }
  const adjA = orig => orig - kiA.filter(k => k.origRank < orig && k.overallPick > orig).length;
  const adjB = orig => orig - kiB.filter(k => k.origRank < orig && k.overallPick > orig).length;
  const comp = [];
  for (const [name, pos, rankB] of ranksB) {
    const rankA = mapA.get(name);
    if (rankA == null || keeperMap.has(name)) continue;
    const aAdj = adjA(rankA), bAdj = adjB(rankB);
    if (aAdj > 200 && bAdj > 200) continue;
    comp.push([name, pos, aAdj, bAdj, rankA, rankB]);
  }
  comp.sort((a, b) => a[3] - b[3]);
  return comp;
}
function activeComp() { return buildComparison(compA, compB); }

let compPoints = [];

function drawCompChart() {
  const canvas = document.getElementById('comp-chart');
  const container = canvas.parentElement;
  const srcLabel = SRC_SHORT[compB];
  const rawCapped = activeComp().filter(c => c[3] <= 200);
  const usedRanks = new Set(rawCapped.map(c => c[3]));
  const capped = [];
  let ri = 0;
  for (let rank = 1; rank <= 200; rank++) {
    if (ri < rawCapped.length && rawCapped[ri][3] === rank) {
      capped.push(rawCapped[ri]);
      ri++;
    } else if (!usedRanks.has(rank)) {
      capped.push(['Keeper/K/DST', null, rank, rank, null, null, true]);
    }
  }
  while (ri < rawCapped.length) { capped.push(rawCapped[ri++]); }

  const W = Math.min(900, container.clientWidth - 32);
  const H = Math.round(W * 0.55);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { l: 48, r: 20, t: 20, b: 40 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;
  const n = capped.length;
  const barW = Math.min(6, pw / n * 0.7);

  const minV = 1;
  const maxV = 200;
  const rangeV = 199;

  const sx = i => pad.l + (i + 0.5) / n * pw;
  const sy = v => pad.t + ((v - minV) / rangeV) * ph;

  ctx.fillStyle = '#181b23';
  ctx.fillRect(0, 0, W, H);

  // Horizontal grid every 12 (round boundary)
  ctx.strokeStyle = '#232631';
  ctx.lineWidth = 0.5;
  ctx.fillStyle = '#555869';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  for (let v = 12; v <= maxV; v += 12) {
    const y = sy(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText(v, pad.l - 6, y + 4);
  }

  // Axis labels
  ctx.fillStyle = '#8b8fa3';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Players (sorted by ' + srcLabel + ' rank)', pad.l + pw / 2, H - 4);
  ctx.save();
  ctx.translate(12, pad.t + ph / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Adjusted Rank', 0, 0);
  ctx.restore();

  // Round boundary lines
  if (n > 0) {
    ctx.strokeStyle = '#3a3d52';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.fillStyle = '#555869';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    let prevRound = Math.floor((capped[0][3] - 1) / TEAMS);
    for (let i = 1; i < n; i++) {
      const curRound = Math.floor((capped[i][3] - 1) / TEAMS);
      if (curRound !== prevRound) {
        const bx = pad.l + i / n * pw;
        ctx.beginPath(); ctx.moveTo(bx, pad.t); ctx.lineTo(bx, H - pad.b); ctx.stroke();
        ctx.fillText('R' + (curRound + 1), bx, pad.t - 4);
      }
      prevRound = curRound;
    }
    ctx.fillText('R' + (Math.floor((capped[0][3] - 1) / TEAMS) + 1), pad.l + 12, pad.t - 4);
    ctx.setLineDash([]);
  }

  // Draw candles
  compPoints = [];
  for (let i = 0; i < n; i++) {
    const c = capped[i];
    const x = sx(i);
    const isGap = c[6] === true;

    if (isGap) {
      const y = sy(c[3]);
      ctx.fillStyle = '#9a8abf';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(x, y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      compPoints.push({ x, espnY: y, dsY: y, c, diff: 0, isGap: true });
      continue;
    }

    const espnY = sy(c[3]);
    const dsY = sy(c[2]);
    const diff = c[2] - c[3];

    // Bar from ESPN to DS
    const color = diff < 0 ? '#58b896' : diff > 0 ? '#d45555' : '#555';
    ctx.strokeStyle = color;
    ctx.lineWidth = barW;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(x, espnY);
    ctx.lineTo(x, dsY);
    ctx.stroke();

    // ESPN dot (source of truth)
    ctx.fillStyle = '#8b8fa3';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(x, espnY, 2, 0, Math.PI * 2);
    ctx.fill();

    // DS dot at end of bar
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(x, dsY, 2.5, 0, Math.PI * 2);
    ctx.fill();

    compPoints.push({ x, espnY, dsY, c, diff });
  }
  ctx.globalAlpha = 1.0;
}

function setupCompHover() {
  const canvas = document.getElementById('comp-chart');
  const tooltip = document.getElementById('comp-tooltip');
  const dpr = window.devicePixelRatio || 1;

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / dpr) / rect.width;

    let nearest = null;
    let minDist = 12;
    for (const p of compPoints) {
      const d = Math.abs(mx - p.x);
      if (d < minDist) { minDist = d; nearest = p; }
    }

    if (nearest) {
      const c = nearest.c;
      if (nearest.isGap) {
        tooltip.innerHTML = `<span style="color:#9a8abf"><strong>Keeper/K/DST</strong></span><br>Rank ${c[3]}`;
      } else {
        const diff = nearest.diff;
        const srcLbl = SRC_SHORT[compB];
        const baseLbl = SRC_SHORT[compA];
        const arrow = diff < 0 ? '<span style="color:#58b896">higher</span>' : '<span style="color:#d45555">lower</span>';
        tooltip.innerHTML =
          `<strong>${c[0]}</strong> · ${c[1]}<br>` +
          `${srcLbl} adj: ${c[3]} · ${baseLbl} adj: ${c[2]}<br>` +
          `${baseLbl} ranks ${Math.abs(diff)} spots ${diff < 0 ? arrow : arrow}`;
      }
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  });

  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

/* ── Combined value chart ── */
/* keeper benefit = orig_rank - ds_adj, espn arbitrage = espn_adj - ds_adj */
let combinedPoints = [];
let combinedSort = 'combined';
let combinedPos = 'ALL';
let combinedPick = 0;
let combinedRound = 0;

function getPickSlots(pick, round) {
  const slots = [];
  const rounds = round > 0 ? [round] : Array.from({length: ROUNDS}, (_, i) => i + 1);
  for (const r of rounds) {
    const slot = r % 2 === 1 ? (r - 1) * TEAMS + pick : r * TEAMS - pick + 1;
    slots.push(slot);
  }
  return slots;
}

function inRound(espnAdj, round) {
  const lo = (round - 1) * TEAMS + 1;
  const hi = round * TEAMS;
  return espnAdj >= lo - 2 && espnAdj <= hi + 2;
}

function drawCombinedChart() {
  const canvas = document.getElementById('combined-chart');
  const container = canvas.parentElement;
  const pickSlots = combinedPick > 0 ? getPickSlots(combinedPick, combinedRound) : null;
  const srcLabel2 = SRC_SHORT[compB];
  const rawItems = activeComp()
    .filter(c => c[3] <= ROUNDS * TEAMS && (combinedPos === 'ALL' || c[1] === combinedPos)
      && (!pickSlots || pickSlots.some(s => Math.abs(c[3] - s) <= 2))
      && (combinedRound === 0 || combinedPick > 0 || inRound(c[3], combinedRound)))
    .map(c => {
      const dsRaw = c[4], espnRaw = c[5];
      const keeperImpact = c[3] - espnRaw;
      const dsArb = espnRaw - dsRaw;
      const val = keeperImpact + dsArb;
      return { name: c[0], pos: c[1], dsAdj: c[2], espnAdj: c[3], dsRaw, espnRaw, keeperImpact, dsArb, val };
    });
  if (combinedSort === 'srcrank') {
    rawItems.sort((a, b) => a.espnAdj - b.espnAdj);
    const usedRanks3 = new Set(rawItems.map(it => it.espnAdj));
    const maxRank3 = rawItems.length > 0 ? rawItems[rawItems.length - 1].espnAdj : 0;
    let items = [];
    let ri3 = 0;
    for (let rank = 1; rank <= maxRank3; rank++) {
      if (ri3 < rawItems.length && rawItems[ri3].espnAdj === rank) {
        items.push(rawItems[ri3]);
        ri3++;
      } else if (!usedRanks3.has(rank)) {
        const inFilter = combinedRound === 0 || inRound(rank, combinedRound);
        const inPick = !pickSlots || pickSlots.some(s => Math.abs(rank - s) <= 2);
        const gapLabel = combinedPos !== 'ALL' ? 'Keeper/K/DST or filtered' : 'Keeper/K/DST';
        if (inFilter && inPick) items.push({ name: gapLabel, pos: null, espnAdj: rank, val: 0, isGap: true });
      }
    }
    while (ri3 < rawItems.length) items.push(rawItems[ri3++]);
  } else {
    rawItems.sort((a, b) => b.val - a.val);
    let items = rawItems;
  }

  const W = Math.min(900, container.clientWidth - 32);
  const H = Math.round(W * 0.55);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { l: 48, r: 20, t: 20, b: 40 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;
  const n = items.length;
  const barW = Math.min(8, pw / n * 0.7);

  const maxVal = 50;
  const minVal = -50;
  const range = 100;

  const sx = i => pad.l + (i + 0.5) / n * pw;
  const sy = v => pad.t + (1 - (v - minVal) / range) * ph;
  const zeroY = sy(0);

  ctx.fillStyle = '#181b23';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#232631';
  ctx.lineWidth = 0.5;
  ctx.fillStyle = '#555869';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  const step = range > 40 ? 10 : 5;
  for (let v = Math.ceil(minVal / step) * step; v <= maxVal; v += step) {
    const y = sy(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText(v, pad.l - 6, y + 4);
  }

  // Zero line
  ctx.strokeStyle = '#555869';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(W - pad.r, zeroY); ctx.stroke();

  // Axis labels
  ctx.fillStyle = '#8b8fa3';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(combinedSort === 'srcrank' ? 'Players (by ' + srcLabel2 + ' rank)' : 'Players (by value)', pad.l + pw / 2, H - 4);
  ctx.save();
  ctx.translate(12, pad.t + ph / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Combined Value (ranks)', 0, 0);
  ctx.restore();

  // Round boundary lines (only when sorted by rank)
  if (n > 0 && combinedSort === 'srcrank') {
    ctx.strokeStyle = '#3a3d52';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.fillStyle = '#555869';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    let prevRound = Math.floor((items[0].espnAdj - 1) / TEAMS);
    for (let i = 1; i < n; i++) {
      const curRound = Math.floor((items[i].espnAdj - 1) / TEAMS);
      if (curRound !== prevRound) {
        const bx = pad.l + i / n * pw;
        ctx.beginPath(); ctx.moveTo(bx, pad.t); ctx.lineTo(bx, H - pad.b); ctx.stroke();
        ctx.fillText('R' + (curRound + 1), bx, pad.t - 4);
      }
      prevRound = curRound;
    }
    ctx.fillText('R' + (Math.floor((items[0].espnAdj - 1) / TEAMS) + 1), pad.l + 12, pad.t - 4);
    ctx.setLineDash([]);
  }

  // Draw bars — single bar colored by combined sign, dot at combined value
  combinedPoints = [];
  for (let i = 0; i < n; i++) {
    const item = items[i];
    const x = sx(i);

    if (item.isGap) {
      ctx.fillStyle = '#9a8abf';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(x, zeroY, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
      combinedPoints.push({ x, item });
      continue;
    }

    const combY = sy(item.val);
    const color = item.val >= 0 ? '#58b896' : '#d45555';
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    if (item.val >= 0) {
      ctx.fillRect(x - barW / 2, combY, barW, zeroY - combY);
    } else {
      ctx.fillRect(x - barW / 2, zeroY, barW, combY - zeroY);
    }

    // Dot
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(x, combY, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1.0;
    combinedPoints.push({ x, item });
  }
}

function setupCombinedHover() {
  const canvas = document.getElementById('combined-chart');
  const tooltip = document.getElementById('combined-tooltip');
  const dpr = window.devicePixelRatio || 1;

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / dpr) / rect.width;

    let nearest = null;
    let minDist = 12;
    for (const p of combinedPoints) {
      const d = Math.abs(mx - p.x);
      if (d < minDist) { minDist = d; nearest = p; }
    }

    if (nearest) {
      const it = nearest.item;
      if (it.isGap) {
        tooltip.innerHTML = `<span style="color:#9a8abf"><strong>${it.name}</strong></span><br>Rank ${it.espnAdj}`;
      } else {
        const srcLbl2 = SRC_SHORT[compB];
        const baseLbl2 = SRC_SHORT[compA];
        tooltip.innerHTML =
          `<strong>${it.name}</strong> · ${it.pos}<br>` +
          `${srcLbl2}: ${it.espnRaw} → adj ${it.espnAdj} · ${baseLbl2}: ${it.dsRaw}<br>` +
          `Keepers: ${it.keeperImpact >= 0 ? '+' : ''}${it.keeperImpact} · ${baseLbl2} arb: ${it.dsArb >= 0 ? '+' : ''}${it.dsArb}<br>` +
          `<strong>True value: ${it.val >= 0 ? '+' : ''}${it.val}</strong>`;
      }
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  });

  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

function updateCompTitles() {
  const aLabel = SRC_LABELS[compA];
  const bLabel = SRC_LABELS[compB];
  document.getElementById('comp-title').textContent = aLabel + ' vs ' + bLabel + ' Rankings';
  document.getElementById('combined-desc').textContent = 'Value at ' + bLabel + ' rank by ' + aLabel + ', including keeper adjustment';
}

function redrawComps() {
  updateCompTitles();
  drawCompChart();
  drawCombinedChart();
}

document.querySelectorAll('.comp-base').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.comp-base').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    compBase = btn.dataset.base;
    rebuildKeeperInfo();
    renderBoard();
    if (document.querySelector('.tab[data-tab="analytics"]').classList.contains('active')) {
      drawChart();
    }
  });
});

document.querySelectorAll('.comp-a').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.src === compB) return;
    document.querySelectorAll('.comp-a').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    compA = btn.dataset.src;
    redrawComps();
  });
});

document.querySelectorAll('.comp-b').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.src === compA) return;
    document.querySelectorAll('.comp-b').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    compB = btn.dataset.src;
    redrawComps();
  });
});

document.querySelectorAll('#sortCombined, #sortSrcRank').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#sortCombined, #sortSrcRank').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    combinedSort = btn.dataset.sort;
    drawCombinedChart();
  });
});

document.querySelectorAll('.comb-pos').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.comb-pos').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    combinedPos = btn.dataset.cpos;
    drawCombinedChart();
  });
});

document.getElementById('pickSpot').addEventListener('change', function() {
  combinedPick = parseInt(this.value);
  drawCombinedChart();
});

document.getElementById('roundFilter').addEventListener('change', function() {
  combinedRound = parseInt(this.value);
  drawCombinedChart();
});

/* ── Events ── */
document.getElementById('tbody').addEventListener('click', e => {
  const btn = e.target.closest('.draft-btn');
  if (!btn) return;
  const name = btn.dataset.name;
  if (drafted.has(name)) drafted.delete(name);
  else drafted.add(name);
  saveDrafted();
  renderBoard();
});

document.querySelectorAll('.chip[data-pos]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-pos]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    posFilter = chip.dataset.pos;
    renderBoard();
  });
});

document.getElementById('toggleDrafted').addEventListener('click', function() {
  hideDrafted = !hideDrafted;
  this.textContent = hideDrafted ? 'Show Drafted' : 'Hide Drafted';
  this.classList.toggle('on', hideDrafted);
  renderBoard();
});

document.getElementById('toggleKeepers').addEventListener('click', function() {
  hideKeepers = !hideKeepers;
  this.textContent = hideKeepers ? 'Show Keepers' : 'Hide Keepers';
  this.classList.toggle('on', hideKeepers);
  renderBoard();
});

document.getElementById('resetAll').addEventListener('click', () => {
  if (drafted.size === 0) return;
  if (!confirm('Reset all drafted picks?')) return;
  drafted.clear();
  saveDrafted();
  renderBoard();
});

document.getElementById('search').addEventListener('input', function() {
  searchTerm = this.value.toLowerCase().trim();
  renderBoard();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
    if (tab.dataset.tab === 'analytics') {
      drawChart();
      drawCompChart();
      drawCombinedChart();
    }
  });
});

renderBoard();
setupChartHover();
setupCompHover();
setupCombinedHover();
</script>

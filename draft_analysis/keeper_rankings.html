<title>Keeper Rankings</title>
<style>
:root {
  --bg: #F0EEE9;
  --bg-table: #F7F5F1;
  --bg-row-hover: #E8E5DE;
  --bg-header: #2A2D35;
  --text: #1E2028;
  --text-secondary: #6D6F78;
  --text-header: #E4E2DC;
  --border: #D5D2CA;
  --pos-qb: #C4653A;
  --pos-rb: #3A82A8;
  --pos-wr: #6A8C3A;
  --pos-te: #8A6AB5;
  --positive: #268A6E;
  --negative: #BE4F3A;
  --chip-bg: #E2DFD8;
  --chip-active-bg: #2A2D35;
  --chip-active-text: #E4E2DC;
  --highlight-row: rgba(38, 138, 110, 0.06);
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318;
    --bg-table: #181A21;
    --bg-row-hover: #23262F;
    --bg-header: #0D0E13;
    --text: #D2D0C8;
    --text-secondary: #8A8C94;
    --text-header: #A8A6A0;
    --border: #2A2D36;
    --pos-qb: #D97A50;
    --pos-rb: #4FA0C8;
    --pos-wr: #85AD50;
    --pos-te: #A685D0;
    --positive: #3CB08A;
    --negative: #D4634B;
    --chip-bg: #23262F;
    --chip-active-bg: #D2D0C8;
    --chip-active-text: #111318;
    --highlight-row: rgba(60, 176, 138, 0.06);
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  --bg: #111318;
  --bg-table: #181A21;
  --bg-row-hover: #23262F;
  --bg-header: #0D0E13;
  --text: #D2D0C8;
  --text-secondary: #8A8C94;
  --text-header: #A8A6A0;
  --border: #2A2D36;
  --pos-qb: #D97A50;
  --pos-rb: #4FA0C8;
  --pos-wr: #85AD50;
  --pos-te: #A685D0;
  --positive: #3CB08A;
  --negative: #D4634B;
  --chip-bg: #23262F;
  --chip-active-bg: #D2D0C8;
  --chip-active-text: #111318;
  --highlight-row: rgba(60, 176, 138, 0.06);
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  margin: 0;
  padding: 20px 20px 60px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

.page-header {
  max-width: 1400px;
  margin: 0 auto 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 12px 24px;
}

.page-header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  white-space: nowrap;
}

.page-header .subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0;
}

.controls {
  max-width: 1400px;
  margin: 0 auto 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.controls .label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  margin-right: 2px;
}

.chip {
  display: inline-flex;
  align-items: center;
  padding: 5px 14px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  background: var(--chip-bg);
  color: var(--text);
  border: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}
.chip:hover { opacity: 0.85; }
.chip.active {
  background: var(--chip-active-bg);
  color: var(--chip-active-text);
}

.table-wrap {
  max-width: 1400px;
  margin: 0 auto;
  overflow-x: auto;
  border-radius: 6px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
  min-width: 900px;
}

thead {
  position: sticky;
  top: 0;
  z-index: 2;
}

thead th {
  background: var(--bg-header);
  color: var(--text-header);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 10px 12px;
  text-align: right;
  white-space: nowrap;
  cursor: pointer;
  border-bottom: 2px solid var(--border);
  position: relative;
  user-select: none;
  transition: color 0.15s;
}
thead th:hover { color: #fff; }
thead th.col-name,
thead th.col-pos,
thead th.col-team { text-align: left; }

thead th .sort-arrow {
  display: inline-block;
  width: 14px;
  margin-left: 3px;
  font-size: 10px;
  opacity: 0.35;
  vertical-align: middle;
}
thead th.sorted .sort-arrow { opacity: 1; }

tbody tr {
  background: var(--bg-table);
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
tbody tr:hover { background: var(--bg-row-hover); }
tbody tr.highlight { background: var(--highlight-row); }

td {
  padding: 7px 12px;
  font-size: 13px;
  text-align: right;
  white-space: nowrap;
}

td.col-name {
  text-align: left;
  font-weight: 600;
  letter-spacing: -0.01em;
  min-width: 180px;
}

td.col-pos {
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
}
td.col-pos span {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 3px;
  line-height: 1.3;
}
td.col-pos .QB { color: var(--pos-qb); }
td.col-pos .RB { color: var(--pos-rb); }
td.col-pos .WR { color: var(--pos-wr); }
td.col-pos .TE { color: var(--pos-te); }

td.col-team {
  text-align: left;
  color: var(--text-secondary);
  font-size: 12px;
}

td.col-injury { font-size: 12px; }

td.col-change {
  font-weight: 700;
  font-size: 13px;
}
td.col-change.pos { color: var(--positive); }
td.col-change.neg { color: var(--negative); }

td.col-adjusted {
  font-weight: 700;
  font-size: 13px;
}

.bar-cell {
  position: relative;
}
.bar-cell .bar {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 0;
  border-radius: 2px;
  opacity: 0.12;
  pointer-events: none;
}
.bar-cell .bar.pos-bar { background: var(--positive); }
.bar-cell .bar.neg-bar { background: var(--negative); right: 0; left: auto; }
.bar-cell .val { position: relative; z-index: 1; }

.legend {
  max-width: 1400px;
  margin: 16px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 11px;
  color: var(--text-secondary);
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.legend .dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  display: inline-block;
}

.divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 6px;
}

.round-chips {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
}
.round-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: var(--chip-bg);
  color: var(--text-secondary);
  border: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}
.round-chip:hover { opacity: 0.85; }
.round-chip.active {
  background: var(--chip-active-bg);
  color: var(--chip-active-text);
}

.filter-count {
  font-size: 11px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

@media (max-width: 640px) {
  body { padding: 12px 8px 40px; }
  .page-header h1 { font-size: 18px; }
  td, thead th { padding: 6px 8px; }
  td.col-name { min-width: 140px; }
}
</style>

const COLS = [
  { key: 0,  label: 'Rk',      cls: 'col-rank' },
  { key: 1,  label: 'Player',   cls: 'col-name' },
  { key: 2,  label: 'Pos',      cls: 'col-pos' },
  { key: 3,  label: 'Team',     cls: 'col-team' },
  { key: 4,  label: 'Age',      cls: '' },
  { key: 5,  label: 'Exp',      cls: '' },
  { key: 6,  label: 'Injury',   cls: 'col-injury' },
  { key: 7,  label: 'Floor',    cls: '' },
  { key: 8,  label: 'DS Proj',  cls: '' },
  { key: 9,  label: 'Ceiling',  cls: '' },
  { key: 10, label: '3D Val',   cls: '' },
  { key: 11, label: 'Keeper Δ', cls: 'col-change' },
  { key: 12, label: 'Adjusted', cls: 'col-adjusted' },
];

let sortCol = 12;
let sortDir = -1; // -1 = desc
let posFilter = 'ALL';
let selectedRounds = new Set(); // empty = show all

function parseNum(v) {
  if (v == null) return -Infinity;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace('%', '')) || 0;
}

function sortData() {
  const col = sortCol;
  D.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'string' && typeof vb === 'string') {
      return sortDir * va.localeCompare(vb);
    }
    return sortDir * (parseNum(va) - parseNum(vb));
  });
}

function renderHeader() {
  const tr = document.getElementById('header-row');
  tr.innerHTML = '';
  COLS.forEach((c, i) => {
    const th = document.createElement('th');
    th.className = c.cls + (sortCol === c.key ? ' sorted' : '');
    const arrow = sortCol === c.key ? (sortDir === 1 ? '▲' : '▼') : '⇅';
    th.innerHTML = c.label + '<span class="sort-arrow">' + arrow + '</span>';
    th.addEventListener('click', () => {
      if (sortCol === c.key) sortDir *= -1;
      else { sortCol = c.key; sortDir = (c.key <= 3 || c.key === 6) ? 1 : -1; }
      render();
    });
    tr.appendChild(th);
  });
}

function fmtChange(v) {
  if (v == null) return '';
  return (v >= 0 ? '+' : '') + v.toFixed(1);
}

const maxAbsChange = Math.max(...D.map(r => Math.abs(r[11] || 0)));

function renderBody() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  const filtered = D.filter(r => {
    if (posFilter !== 'ALL' && r[2] !== posFilter) return false;
    if (selectedRounds.size > 0) {
      const playerRound = Math.ceil(r[0] / 12);
      if (!selectedRounds.has(playerRound)) return false;
    }
    return true;
  });

  document.getElementById('filter-count').textContent = filtered.length + ' players';

  filtered.forEach(r => {
    const tr = document.createElement('tr');
    const chg = r[11] || 0;
    if (chg > 8) tr.className = 'highlight';

    COLS.forEach(c => {
      const td = document.createElement('td');
      td.className = c.cls;
      const v = r[c.key];

      if (c.key === 2) {
        td.innerHTML = '<span class="' + v + '">' + v + '</span>';
      } else if (c.key === 11) {
        td.classList.add(chg >= 0 ? 'pos' : 'neg');
        td.classList.add('bar-cell');
        const pct = Math.min(100, (Math.abs(chg) / maxAbsChange) * 100);
        const barCls = chg >= 0 ? 'pos-bar' : 'neg-bar';
        td.innerHTML = '<span class="bar ' + barCls + '" style="width:' + pct + '%"></span><span class="val">' + fmtChange(chg) + '</span>';
      } else if (c.key === 12) {
        td.textContent = v != null ? v.toFixed(1) : '';
        td.style.color = chg >= 5 ? 'var(--positive)' : chg <= -5 ? 'var(--negative)' : '';
      } else if (typeof v === 'number' && c.key >= 7 && c.key <= 10) {
        td.textContent = v.toFixed(1);
      } else {
        td.textContent = v != null ? v : '';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function render() {
  sortData();
  renderHeader();
  renderBody();
}

document.querySelectorAll('.chip[data-pos]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-pos]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    posFilter = btn.dataset.pos;
    render();
  });
});

// Build round chips
const maxRound = Math.ceil(Math.max(...D.map(r => r[0])) / 12);
const rcContainer = document.getElementById('round-chips');
for (let rd = 1; rd <= maxRound; rd++) {
  const btn = document.createElement('button');
  btn.className = 'round-chip';
  btn.textContent = rd;
  btn.dataset.round = rd;
  btn.addEventListener('click', () => {
    const r = parseInt(btn.dataset.round, 10);
    if (selectedRounds.has(r)) {
      selectedRounds.delete(r);
      btn.classList.remove('active');
    } else {
      selectedRounds.add(r);
      btn.classList.add('active');
    }
    render();
  });
  rcContainer.appendChild(btn);
}

render();
</script>
